<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Inter', system-ui, sans-serif">

  <!-- Backdrop dark -->
  <rect width="1200" height="900" fill="#14121C"/>

  <!-- Header -->
  <g transform="translate(80, 60)">
    <polygon points="0,28 14,0 28,28" fill="#7C5CBF"/>
    <polygon points="14,28 28,4 42,28" fill="#9B8EC4"/>
    <polygon points="28,28 42,0 56,28" fill="#7C5CBF" opacity="0.9"/>
    <text x="72" y="24" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="18" font-weight="600">WebStrategy</text>

    <text x="220" y="22" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="26" font-weight="600">In the editor</text>
    <text x="395" y="22" fill="#9590A8" font-size="12" letter-spacing="2">PASTE FROM WORD → CLEAN HTML</text>
  </g>

  <line x1="80" y1="108" x2="1120" y2="108" stroke="#2E2B38"/>

  <!-- Word document mock (left) -->
  <g transform="translate(80, 150)">
    <!-- Window chrome -->
    <rect width="430" height="640" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <rect x="0" y="0" width="430" height="40" rx="12" fill="#221D32"/>
    <rect x="0" y="28" width="430" height="12" fill="#221D32"/>
    <circle cx="18" cy="20" r="5" fill="#FF5F57"/>
    <circle cx="36" cy="20" r="5" fill="#FEBC2E"/>
    <circle cx="54" cy="20" r="5" fill="#28C840"/>
    <text x="215" y="25" fill="#9590A8" font-size="12" text-anchor="middle">Microsoft Word — Document.docx</text>

    <!-- Document page -->
    <rect x="40" y="60" width="350" height="540" rx="2" fill="#F0EDE8"/>

    <!-- Heading -->
    <text x="60" y="100" fill="#14121C" font-family="Calibri, Arial" font-size="22" font-weight="700">Quarterly Report</text>
    <text x="60" y="124" fill="#4A4260" font-family="Calibri, Arial" font-size="11">Q3 2026 — Internal draft</text>

    <!-- Body text -->
    <g font-family="Calibri, Arial" font-size="13" fill="#221D32">
      <text x="60" y="170">Lorem ipsum dolor sit amet,</text>
      <text x="60" y="190">consectetur adipiscing elit.</text>
      <text x="60" y="210">Sed do eiusmod tempor incididunt</text>
      <text x="60" y="230">ut labore et dolore magna aliqua.</text>

      <text x="60" y="266">Ut enim ad minim veniam,</text>
      <text x="60" y="286">quis nostrud <tspan font-weight="700">exercitation ullamco</tspan></text>
      <text x="60" y="306">laboris nisi ut aliquip ex ea.</text>

      <text x="60" y="342">Duis aute irure dolor in</text>
      <text x="60" y="362"><tspan font-style="italic">reprehenderit in voluptate</tspan> velit</text>
      <text x="60" y="382">esse cillum dolore eu fugiat.</text>
    </g>

    <!-- Selection highlight -->
    <rect x="55" y="155" width="320" height="240" fill="#7C5CBF" opacity="0.15"/>
    <rect x="55" y="155" width="320" height="240" fill="none" stroke="#7C5CBF" stroke-dasharray="3 3"/>

    <!-- Copy badge -->
    <g transform="translate(280, 540)">
      <rect width="92" height="36" rx="18" fill="#221D32" stroke="#7C5CBF"/>
      <text x="46" y="23" fill="#A899D4" font-size="12" font-weight="600" text-anchor="middle">⌘C copied</text>
    </g>
  </g>

  <!-- Arrow + plugin badge between (vertical layout to fit the 130px gap) -->
  <g transform="translate(575, 470)">
    <!-- Plugin icon disc -->
    <circle cx="0" cy="-90" r="32" fill="#7C5CBF"/>
    <g transform="translate(-12, -102) scale(0.04)" fill="none" stroke="#F0EDE8" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <!-- Broom-like sweep icon -->
      <path d="M 100 100 L 500 500"/>
      <path d="M 480 480 L 380 580 L 280 580 L 380 480 Z" fill="#F0EDE8"/>
    </g>

    <!-- Two-line label -->
    <text x="0" y="-44" fill="#F0EDE8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.8">WS PASTE</text>
    <text x="0" y="-30" fill="#F0EDE8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.8">CLEANER</text>

    <!-- Arrow -->
    <path d="M-26 0 L 26 0 M 20 -7 L 26 0 L 20 7" stroke="#7C5CBF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Caption -->
    <text x="0" y="32" fill="#9590A8" font-size="9" text-anchor="middle">strips Mso* / o:p</text>
    <text x="0" y="46" fill="#9590A8" font-size="9" text-anchor="middle">w:* / styles</text>
  </g>

  <!-- WordPress editor mock (right) -->
  <g transform="translate(640, 150)">
    <!-- Window chrome -->
    <rect width="480" height="640" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <rect x="0" y="0" width="480" height="40" rx="12" fill="#221D32"/>
    <rect x="0" y="28" width="480" height="12" fill="#221D32"/>
    <circle cx="18" cy="20" r="5" fill="#FF5F57"/>
    <circle cx="36" cy="20" r="5" fill="#FEBC2E"/>
    <circle cx="54" cy="20" r="5" fill="#28C840"/>
    <text x="240" y="25" fill="#9590A8" font-size="12" text-anchor="middle">WordPress — Block editor</text>

    <!-- Top bar of editor -->
    <rect x="0" y="40" width="480" height="36" fill="#1d2327"/>
    <rect x="14" y="50" width="22" height="16" rx="3" fill="#3858e9"/>
    <text x="46" y="62" fill="#fff" font-size="11">+ Add</text>
    <text x="98" y="62" fill="#c3c4c7" font-size="11">↶ ↷</text>
    <rect x="416" y="48" width="48" height="20" rx="3" fill="#3858e9"/>
    <text x="440" y="62" fill="#fff" font-size="10" text-anchor="middle" font-weight="600">Save</text>

    <!-- Editor canvas -->
    <rect x="20" y="96" width="440" height="524" rx="4" fill="#fff"/>

    <!-- Title placeholder -->
    <text x="40" y="138" fill="#1d2327" font-family="serif" font-size="22" font-weight="700">Quarterly Report</text>
    <line x1="40" y1="160" x2="440" y2="160" stroke="#e0e0e0"/>

    <!-- Block: paragraph (cleaned) -->
    <rect x="32" y="180" width="416" height="84" fill="#fff" stroke="#7C5CBF" stroke-dasharray="4 4" rx="2"/>
    <g font-family="Georgia, serif" font-size="13" fill="#1d2327">
      <text x="48" y="204">Lorem ipsum dolor sit amet, consectetur</text>
      <text x="48" y="222">adipiscing elit. Sed do eiusmod tempor</text>
      <text x="48" y="240">incididunt ut labore et dolore magna aliqua.</text>
    </g>

    <!-- Block: paragraph with strong -->
    <rect x="32" y="278" width="416" height="84" fill="#fff" rx="2"/>
    <g font-family="Georgia, serif" font-size="13" fill="#1d2327">
      <text x="48" y="302">Ut enim ad minim veniam, quis nostrud</text>
      <text x="48" y="320"><tspan font-weight="700">exercitation ullamco</tspan> laboris nisi ut</text>
      <text x="48" y="338">aliquip ex ea.</text>
    </g>

    <!-- Block: paragraph with em -->
    <rect x="32" y="376" width="416" height="84" fill="#fff" rx="2"/>
    <g font-family="Georgia, serif" font-size="13" fill="#1d2327">
      <text x="48" y="400">Duis aute irure dolor in</text>
      <text x="48" y="418"><tspan font-style="italic">reprehenderit in voluptate</tspan> velit</text>
      <text x="48" y="436">esse cillum dolore eu fugiat.</text>
    </g>

    <!-- Toast: cleanup confirmation -->
    <g transform="translate(32, 484)">
      <rect width="416" height="48" rx="8" fill="rgba(124,92,191,0.08)" stroke="#7C5CBF"/>
      <circle cx="22" cy="24" r="11" fill="#7C5CBF"/>
      <path d="M-4 0 L -1 3 L 4 -3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(22, 24)"/>
      <text x="44" y="22" fill="#221D32" font-size="12" font-weight="600">WS Paste Cleaner</text>
      <text x="44" y="38" fill="#4A4260" font-size="11">487 chars → 68 chars (−86%)  •  Moderate level</text>
    </g>

    <!-- Stats badge -->
    <g transform="translate(32, 552)">
      <text x="0" y="12" fill="#9590A8" font-size="11">Local stats: 1,248 cleanups performed today</text>
    </g>
  </g>

</svg>

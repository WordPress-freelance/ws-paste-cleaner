<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" font-family="'Inter', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221D32"/>
      <stop offset="55%" stop-color="#14121C"/>
      <stop offset="100%" stop-color="#1A1724"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CBF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C5CBF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1544" height="500" fill="url(#bg)"/>

  <!-- Decorative violet glow -->
  <ellipse cx="1180" cy="250" rx="380" ry="280" fill="url(#glow)"/>

  <!-- Decorative grid lines -->
  <g stroke="#2E2B38" stroke-width="1" opacity="0.5">
    <line x1="0" y1="100" x2="1544" y2="100"/>
    <line x1="0" y1="400" x2="1544" y2="400"/>
  </g>

  <!-- LEFT: Branding + tagline -->
  <g transform="translate(80, 130)">
    <!-- WebStrategy logo (W triangles) -->
    <g transform="translate(0, 0)">
      <polygon points="0,42 21,0 42,42" fill="#7C5CBF"/>
      <polygon points="21,42 42,6 63,42" fill="#9B8EC4"/>
      <polygon points="42,42 63,0 84,42" fill="#7C5CBF" opacity="0.9"/>
    </g>
    <text x="104" y="32" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="24" font-weight="600">WebStrategy</text>

    <!-- Plugin name -->
    <text x="0" y="120" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="64" font-weight="700">WS Paste Cleaner</text>

    <!-- Tagline -->
    <text x="0" y="170" fill="#C4BFDA" font-size="22">Strip Microsoft Word formatting on paste — automatically.</text>

    <!-- Pills -->
    <g transform="translate(0, 200)">
      <g transform="translate(0, 0)">
        <rect width="116" height="32" rx="16" fill="#221D32" stroke="#4A4260"/>
        <text x="58" y="21" fill="#A899D4" font-size="12" font-weight="600" text-anchor="middle">GUTENBERG</text>
      </g>
      <g transform="translate(128, 0)">
        <rect width="124" height="32" rx="16" fill="#221D32" stroke="#4A4260"/>
        <text x="62" y="21" fill="#A899D4" font-size="12" font-weight="600" text-anchor="middle">CLASSIC EDITOR</text>
      </g>
      <g transform="translate(264, 0)">
        <rect width="98" height="32" rx="16" fill="#7C5CBF"/>
        <text x="49" y="21" fill="#F0EDE8" font-size="12" font-weight="700" text-anchor="middle">100% FREE</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: visual transform mockup -->
  <g transform="translate(900, 90)">

    <!-- Messy page (Word) -->
    <g transform="translate(0, 30)">
      <rect width="200" height="260" rx="8" fill="#1A1724" stroke="#4A4260" stroke-width="1.5"/>
      <text x="20" y="34" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">&lt;p class="MsoNormal"</text>
      <text x="20" y="52" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">   style="margin:0;</text>
      <text x="20" y="70" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">   font-family:Calibri"&gt;</text>
      <text x="20" y="92" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">  &lt;span lang="EN-US"&gt;</text>
      <text x="20" y="110" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">    Hello World</text>
      <text x="20" y="128" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">  &lt;/span&gt;</text>
      <text x="20" y="146" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">  &lt;o:p /&gt;</text>
      <text x="20" y="164" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">&lt;/p&gt;</text>
      <text x="20" y="186" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">&lt;!--[if gte mso 9]&gt;</text>
      <text x="20" y="204" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">  &lt;w:WordDocument&gt;</text>
      <text x="20" y="222" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">  &lt;/w:WordDocument&gt;</text>
      <text x="20" y="240" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">&lt;![endif]--&gt;</text>
    </g>

    <!-- Arrow -->
    <g transform="translate(232, 160)">
      <circle cx="0" cy="0" r="32" fill="#7C5CBF"/>
      <path d="M-12 0 L 12 0 M 6 -7 L 12 0 L 6 7" stroke="#F0EDE8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Clean page (WP) -->
    <g transform="translate(296, 30)">
      <rect width="220" height="260" rx="8" fill="#F0EDE8"/>
      <text x="20" y="36" fill="#7C5CBF" font-family="ui-monospace, monospace" font-size="13" font-weight="600">&lt;p&gt;</text>
      <text x="20" y="60" fill="#221D32" font-family="ui-monospace, monospace" font-size="13">  Hello World</text>
      <text x="20" y="84" fill="#7C5CBF" font-family="ui-monospace, monospace" font-size="13" font-weight="600">&lt;/p&gt;</text>

      <!-- Status -->
      <g transform="translate(20, 200)">
        <circle cx="6" cy="-4" r="4" fill="#7C5CBF"/>
        <text x="18" y="0" fill="#4A4260" font-size="11" font-weight="600">CLEANED</text>
        <text x="18" y="16" fill="#4A4260" font-size="11">3 lines, no Mso, no styles</text>
      </g>
    </g>
  </g>
</svg>

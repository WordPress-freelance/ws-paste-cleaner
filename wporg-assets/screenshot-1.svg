<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Inter', system-ui, sans-serif">

  <!-- Backdrop: WordPress admin area -->
  <rect width="1200" height="900" fill="#1d2327"/>

  <!-- WP Admin sidebar -->
  <rect x="0" y="0" width="160" height="900" fill="#1d2327"/>
  <g font-size="13" fill="#c3c4c7">
    <rect x="0" y="0" width="160" height="46" fill="#191e23"/>
    <circle cx="22" cy="23" r="9" fill="#3858e9"/>
    <text x="40" y="28" fill="#fff" font-weight="600">My Site</text>

    <text x="20" y="78" fill="#fff" font-weight="500">Dashboard</text>
    <text x="20" y="110">Posts</text>
    <text x="20" y="142">Media</text>
    <text x="20" y="174">Pages</text>
    <text x="20" y="206">Comments</text>
    <text x="20" y="238">Appearance</text>
    <text x="20" y="270">Plugins</text>
    <text x="20" y="302">Users</text>
    <text x="20" y="334">Tools</text>

    <!-- Settings active -->
    <rect x="0" y="350" width="160" height="32" fill="#7c5cbf"/>
    <text x="20" y="370" fill="#fff" font-weight="600">Settings</text>

    <!-- Settings submenu -->
    <text x="36" y="402" fill="#a899d4" font-size="12">General</text>
    <text x="36" y="424" fill="#a899d4" font-size="12">Writing</text>
    <text x="36" y="446" fill="#a899d4" font-size="12">Reading</text>
    <text x="36" y="468" fill="#a899d4" font-size="12">Discussion</text>
    <text x="36" y="490" fill="#a899d4" font-size="12">Media</text>
    <text x="36" y="512" fill="#a899d4" font-size="12">Permalinks</text>
    <rect x="32" y="525" width="124" height="20" fill="rgba(124,92,191,0.2)"/>
    <text x="36" y="540" fill="#fff" font-size="12" font-weight="600">WS Paste Cleaner</text>
  </g>

  <!-- WP Admin top bar -->
  <rect x="160" y="0" width="1040" height="32" fill="#1d2327"/>
  <text x="180" y="20" fill="#c3c4c7" font-size="12">★ My Site</text>
  <circle cx="1170" cy="16" r="10" fill="#3858e9"/>
  <text x="1162" y="20" fill="#fff" font-size="11" font-weight="600">SC</text>

  <!-- Main content area: WS Paste Cleaner page (dark WebStrategy bg) -->
  <rect x="160" y="32" width="1040" height="868" fill="#14121C"/>

  <!-- ─── Header WebStrategy ─── -->
  <g transform="translate(200, 60)">
    <!-- Logo abstract: 3 violet triangles in W shape -->
    <g transform="translate(0, 0)">
      <polygon points="0,28 14,0 28,28" fill="#7C5CBF"/>
      <polygon points="14,28 28,4 42,28" fill="#9B8EC4"/>
      <polygon points="28,28 42,0 56,28" fill="#7C5CBF" opacity="0.9"/>
    </g>
    <text x="72" y="24" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="18" font-weight="600">WebStrategy</text>

    <!-- Page title -->
    <text x="200" y="22" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="26" font-weight="600">WS Paste Cleaner</text>
    <text x="424" y="22" fill="#9590A8" font-size="12" letter-spacing="2">SETTINGS</text>
  </g>

  <!-- Separator -->
  <line x1="200" y1="108" x2="1170" y2="108" stroke="#2E2B38" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- MAIN COLUMN -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Card: About -->
  <g transform="translate(200, 132)">
    <rect width="640" height="100" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <line x1="0" y1="48" x2="640" y2="48" stroke="#2E2B38"/>
    <!-- Info icon -->
    <circle cx="22" cy="24" r="8" fill="none" stroke="#9B8EC4" stroke-width="1.6"/>
    <line x1="22" y1="20" x2="22" y2="28" stroke="#9B8EC4" stroke-width="1.6"/>
    <circle cx="22" cy="17" r="0.7" fill="#9B8EC4"/>
    <text x="40" y="29" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="14" font-weight="600">About this plugin</text>
    <text x="20" y="72" fill="#9590A8" font-size="13">WS Paste Cleaner intercepts paste events from Microsoft Word and strips parasitic HTML —</text>
    <text x="20" y="89" fill="#9590A8" font-size="13"><tspan fill="#A899D4" font-family="ui-monospace, monospace">MsoNormal</tspan> classes, inline styles, proprietary Office namespaces.</text>
  </g>

  <!-- Card: Stats -->
  <g transform="translate(200, 252)">
    <rect width="640" height="120" rx="12" fill="#221D32" stroke="#4A4260"/>
    <line x1="0" y1="48" x2="640" y2="48" stroke="#2E2B38"/>
    <!-- Bar chart icon -->
    <g stroke="#9B8EC4" stroke-width="1.6" stroke-linecap="round" fill="none" transform="translate(14, 16)">
      <path d="M3 3v18h18"/>
      <path d="M18 17V9M13 17V5M8 17v-3"/>
    </g>
    <text x="40" y="29" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="14" font-weight="600">Usage statistics</text>

    <text x="20" y="76" fill="#9590A8" font-size="11" letter-spacing="1.5">CLEANUPS PERFORMED</text>
    <text x="20" y="106" fill="#A899D4" font-family="'Lora', Georgia, serif" font-size="34" font-weight="700">1,247</text>
  </g>

  <!-- Card: Configuration -->
  <g transform="translate(200, 392)">
    <rect width="640" height="370" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <line x1="0" y1="48" x2="640" y2="48" stroke="#2E2B38"/>
    <!-- Settings icon -->
    <circle cx="22" cy="24" r="3" stroke="#9B8EC4" stroke-width="1.6" fill="none"/>
    <path d="M30 18 a8 8 0 010 12 M14 30 a8 8 0 010 -12" stroke="#9B8EC4" stroke-width="1.6" fill="none"/>
    <text x="40" y="29" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="14" font-weight="600">Configuration</text>

    <!-- Section: Auto activation -->
    <text x="20" y="80" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="11" letter-spacing="1.5">AUTOMATIC ACTIVATION</text>

    <!-- Toggle ON -->
    <g transform="translate(20, 92)">
      <rect width="44" height="24" rx="12" fill="#7C5CBF"/>
      <circle cx="32" cy="12" r="9" fill="#F0EDE8"/>
    </g>
    <text x="78" y="110" fill="#C4BFDA" font-size="13">Clean automatically on paste</text>

    <!-- Section: Cleaning level -->
    <text x="20" y="156" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="11" letter-spacing="1.5">CLEANING LEVEL</text>

    <!-- Radio: Light -->
    <g transform="translate(20, 168)">
      <rect width="600" height="44" rx="10" fill="#1A1724" stroke="#2E2B38"/>
      <circle cx="20" cy="22" r="8" stroke="#4A4260" stroke-width="2" fill="none"/>
      <text x="44" y="20" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600">Light</text>
      <text x="44" y="36" fill="#9590A8" font-size="11">Strips Word-only metadata. Keeps the rest of the structure intact.</text>
    </g>

    <!-- Radio: Moderate (selected) -->
    <g transform="translate(20, 220)">
      <rect width="600" height="44" rx="10" fill="rgba(124,92,191,0.06)" stroke="#7C5CBF"/>
      <circle cx="20" cy="22" r="8" stroke="#7C5CBF" stroke-width="2" fill="none"/>
      <circle cx="20" cy="22" r="4" fill="#7C5CBF"/>
      <text x="44" y="20" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600">Moderate</text>
      <rect x="120" y="10" width="92" height="16" rx="8" fill="#7C5CBF"/>
      <text x="166" y="21" fill="#F0EDE8" font-size="9" font-weight="700" letter-spacing="0.6" text-anchor="middle">RECOMMENDED</text>
      <text x="44" y="36" fill="#9590A8" font-size="11">Strips all Word markup, preserves semantic structure: headings, lists, links, strong/em.</text>
    </g>

    <!-- Radio: Aggressive -->
    <g transform="translate(20, 272)">
      <rect width="600" height="44" rx="10" fill="#1A1724" stroke="#2E2B38"/>
      <circle cx="20" cy="22" r="8" stroke="#4A4260" stroke-width="2" fill="none"/>
      <text x="44" y="20" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600">Aggressive</text>
      <text x="44" y="36" fill="#9590A8" font-size="11">Plain text only. Removes all HTML and rebuilds the content as paragraphs.</text>
    </g>

    <!-- Save button -->
    <g transform="translate(20, 332)">
      <rect width="180" height="36" rx="8" fill="#7C5CBF"/>
      <path d="M16 24 H 8 a2 2 0 01-2 -2 V 8 a2 2 0 012 -2 h 11 l 5 5 v 11 a 2 2 0 01-2 2 z" fill="none" stroke="#F0EDE8" stroke-width="1.6" transform="translate(8,4)"/>
      <text x="44" y="23" fill="#F0EDE8" font-size="13" font-weight="600">Save settings</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SIDEBAR -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Card sidebar: plugin info -->
  <g transform="translate(870, 132)">
    <rect width="300" height="130" rx="12" fill="#221D32" stroke="#4A4260"/>
    <line x1="0" y1="58" x2="300" y2="58" stroke="#2E2B38"/>
    <text x="20" y="32" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="14" font-weight="600">WS Paste Cleaner</text>
    <text x="20" y="48" fill="#9590A8" font-family="ui-monospace, monospace" font-size="11">v1.0.0</text>

    <!-- Pill -->
    <rect x="20" y="74" width="78" height="18" rx="9" fill="#1A1724" stroke="#4A4260"/>
    <text x="32" y="86" fill="#A899D4" font-size="9" font-weight="600" letter-spacing="0.5">FREE PLUGIN</text>

    <text x="20" y="115" fill="#9590A8" font-size="12">Automatic Microsoft Word cleanup</text>
  </g>

  <!-- Card sidebar: How to use -->
  <g transform="translate(870, 282)">
    <rect width="300" height="180" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <line x1="0" y1="48" x2="300" y2="48" stroke="#2E2B38"/>
    <text x="20" y="29" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="13" font-weight="600">How to use</text>

    <g font-size="12" fill="#9590A8">
      <text x="20" y="72"><tspan fill="#7C5CBF" font-weight="600">1.</tspan> Enable automatic cleaning above.</text>
      <text x="20" y="98"><tspan fill="#7C5CBF" font-weight="600">2.</tspan> Pick your cleaning level.</text>
      <text x="20" y="124"><tspan fill="#7C5CBF" font-weight="600">3.</tspan> Copy content from Microsoft Word.</text>
      <text x="20" y="150"><tspan fill="#7C5CBF" font-weight="600">4.</tspan> Paste into the editor — it's automatic.</text>
    </g>
  </g>

  <!-- Card sidebar: Support -->
  <g transform="translate(870, 482)">
    <rect width="300" height="140" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <rect x="20" y="20" width="120" height="18" rx="9" fill="#221D32" stroke="#4A4260"/>
    <text x="32" y="32" fill="#A899D4" font-size="9" font-weight="600" letter-spacing="0.5">SUPPORT &amp; RESOURCES</text>

    <line x1="0" y1="58" x2="300" y2="58" stroke="#2E2B38"/>

    <g fill="#C4BFDA" font-size="12">
      <text x="42" y="84">Support forum</text>
      <text x="42" y="114">WebStrategy website</text>
    </g>

    <!-- Heart icon -->
    <path d="M12 22s-8-4.5-8-11.8A6.2 6.2 0 0112 4a6.2 6.2 0 018 6.2C20 17.5 12 22 12 22z" fill="none" stroke="#A899D4" stroke-width="1.6" transform="translate(20, 70) scale(0.7)"/>
    <!-- Home icon -->
    <g transform="translate(20, 100) scale(0.7)" fill="none" stroke="#A899D4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </g>
  </g>

</svg>

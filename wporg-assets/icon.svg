<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221D32"/>
      <stop offset="100%" stop-color="#14121C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B8EC4"/>
      <stop offset="100%" stop-color="#7C5CBF"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Subtle violet glow -->
  <circle cx="128" cy="128" r="100" fill="#7C5CBF" opacity="0.08"/>

  <!-- Document with broom motif: messy paper transforming into clean paper -->

  <!-- Left "messy" page (Word) -->
  <g transform="translate(40, 60)">
    <rect width="68" height="86" rx="4" fill="#1A1724" stroke="#4A4260" stroke-width="1.5"/>
    <!-- messy lines -->
    <line x1="10" y1="20" x2="58" y2="20" stroke="#9590A8" stroke-width="2"/>
    <line x1="10" y1="32" x2="48" y2="32" stroke="#4A4260" stroke-width="2" stroke-dasharray="2 1"/>
    <line x1="10" y1="44" x2="56" y2="44" stroke="#9590A8" stroke-width="2"/>
    <line x1="10" y1="56" x2="40" y2="56" stroke="#4A4260" stroke-width="2" stroke-dasharray="2 1"/>
    <line x1="10" y1="68" x2="52" y2="68" stroke="#9590A8" stroke-width="2"/>
  </g>

  <!-- Arrow -->
  <g transform="translate(124, 100)" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="0" y1="14" x2="20" y2="14"/>
    <polyline points="14,6 22,14 14,22"/>
  </g>

  <!-- Right "clean" page -->
  <g transform="translate(150, 60)">
    <rect width="68" height="86" rx="4" fill="#F0EDE8"/>
    <line x1="10" y1="20" x2="58" y2="20" stroke="#7C5CBF" stroke-width="2.5"/>
    <line x1="10" y1="34" x2="50" y2="34" stroke="#221D32" stroke-width="2"/>
    <line x1="10" y1="46" x2="56" y2="46" stroke="#221D32" stroke-width="2"/>
    <line x1="10" y1="58" x2="42" y2="58" stroke="#221D32" stroke-width="2"/>
    <line x1="10" y1="70" x2="52" y2="70" stroke="#221D32" stroke-width="2"/>
  </g>

  <!-- Bottom: violet accent line -->
  <rect x="40" y="184" width="176" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Brand abbr -->
  <text x="128" y="218" fill="#F0EDE8" font-family="'Lora', Georgia, serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">WS</text>
</svg>
